services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
    ports:
      - "1433:1433"
    volumes:
      - crm-sql:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "Your_password123" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=CrmDb;User Id=sa;Password=Your_password123;TrustServerCertificate=true;MultipleActiveResultSets=true"
      Cors__Origins__0: "http://localhost:4200"
      Cors__Origins__1: "http://localhost:8088"
      Authentication__Jwt__Key: "DEV-ONLY-CHANGE-ME-32CHARS-MINIMUM-KEY!!"
      Authentication__Jwt__Issuer: crm
      Authentication__Jwt__Audience: crm
      Email__SendingEnabled: "false"
      Storage__Root: /app/storage
    ports:
      - "5088:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - crm-files:/app/storage

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8088:80"
    depends_on:
      - api

volumes:
  crm-sql:
  crm-files:
